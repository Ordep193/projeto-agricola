version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: my-mysql
    restart: always
    environment:
      MYSQL_DATABASE: emater
      MYSQL_ROOT_PASSWORD: 12345678
    ports:
      - "3310:3306"
    volumes:
      - mysql-volume:/var/lib/mysql

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  mysql-volume:
